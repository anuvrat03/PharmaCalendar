<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PharmaPulse — Live Industry & Regulatory Intelligence</title>
  
  <!-- Fonts & FontAwesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #38bdf8;
      --tag-warning-bg: rgba(239, 68, 68, 0.2);
      --tag-warning-color: #fca5a5;
      --tag-warning-border: #ef4444;
      --tag-recall-bg: rgba(245, 158, 11, 0.2);
      --tag-recall-color: #fcd34d;
      --tag-launch-bg: rgba(34, 197, 94, 0.2);
      --tag-launch-color: #86efac;
      --tag-ma-bg: rgba(168, 85, 247, 0.2);
      --tag-ma-color: #d8b4fe;
      --tag-default-bg: rgba(56, 189, 248, 0.15);
      --tag-default-color: #7dd3fc;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.5;
      padding-bottom: 50px;
    }

    header {
      background-color: #0f172a;
      border-bottom: 1px solid var(--card-border);
      padding: 24px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(8px);
    }

    .header-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo i { font-size: 28px; color: var(--accent-blue); }
    .logo h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }

    .header-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      color: var(--text-muted);
    }
    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(34, 197, 94, 0.1);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.3);
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 12px;
    }
    .live-dot {
      width: 8px;
      height: 8px;
      background-color: #22c55e;
      border-radius: 50%;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }

    main {
      max-width: 1200px;
      margin: 30px auto 0;
      padding: 0 20px;
    }

    /* Search & Filter Bar */
    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .search-box {
      flex: 1;
      min-width: 260px;
      position: relative;
    }
    .search-box i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }
    .search-box input {
      width: 100%;
      padding: 10px 14px 10px 40px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    .search-box input:focus { border-color: var(--accent-blue); }

    .filter-pills {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .pill {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .pill.active, .pill:hover {
      background: var(--accent-blue);
      color: #0f172a;
      font-weight: 600;
      border-color: var(--accent-blue);
    }

    /* News Grid */
    .news-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s;
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: #475569;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .tag {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 4px 8px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .tag.warning { background: var(--tag-warning-bg); color: var(--tag-warning-color); border: 1px solid var(--tag-warning-border); }
    .tag.recall { background: var(--tag-recall-bg); color: var(--tag-recall-color); }
    .tag.launch { background: var(--tag-launch-bg); color: var(--tag-launch-color); }
    .tag.ma { background: var(--tag-ma-bg); color: var(--tag-ma-color); }
    .tag.news { background: var(--tag-default-bg); color: var(--tag-default-color); }

    .source-name {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .card-title {
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 12px;
      line-height: 1.4;
      text-decoration: none;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-title:hover { color: var(--accent-blue); }

    .card-snippet {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 16px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text-muted);
      border-top: 1px solid rgba(255,255,255,0.05);
      padding-top: 12px;
    }

    .read-link {
      color: var(--accent-blue);
      text-decoration: none;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .loading-state {
      text-align: center;
      padding: 60px 0;
      grid-column: 1 / -1;
      color: var(--text-muted);
    }
    .spinner {
      font-size: 32px;
      color: var(--accent-blue);
      margin-bottom: 12px;
    }

    @media (max-width: 600px) {
      .news-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-container">
      <div class="logo">
        <i class="fas fa-pills"></i>
        <h1>PharmaPulse</h1>
      </div>
      <div class="header-meta">
        <span class="live-badge"><span class="live-dot"></span> Live Feed</span>
        <span id="current-date">Updating...</span>
      </div>
    </div>
  </header>

  <main>
    <div class="controls">
      <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="search-input" placeholder="Search drug, company, or alert (e.g. FDA, Sun Pharma)...">
      </div>
      <div class="filter-pills">
        <button class="pill active" onclick="filterArticles('all', this)">All Feed</button>
        <button class="pill" onclick="filterArticles('warning', this)">⚠️ Warning Letters</button>
        <button class="pill" onclick="filterArticles('recall', this)">Alerts & Recalls</button>
        <button class="pill" onclick="filterArticles('launch', this)">Launches & Approvals</button>
      </div>
    </div>

    <div class="news-grid" id="feed-container">
      <div class="loading-state">
        <i class="fas fa-circle-notch fa-spin spinner"></i>
        <p>Fetching real-time regulatory notices and industry news...</p>
      </div>
    </div>
  </main>

  <script>
    // Live RSS Feed Configurations
    const RSS_FEEDS = [
      {
        url: 'https://news.google.com/rss/search?q=USFDA+warning+letter+pharma',
        sourceName: 'USFDA Warning Alert',
        forcedTag: 'warning'
      },
      {
        url: 'https://news.google.com/rss/search?q=CDSCO+drug+alert+or+warning',
        sourceName: 'CDSCO Regulatory Notice',
        forcedTag: 'recall'
      },
      {
        url: 'https://pharma.economictimes.indiatimes.com/rss/topstories',
        sourceName: 'ET Pharma (India)'
      },
      {
        url: 'https://www.fiercepharma.com/rss/xml',
        sourceName: 'FiercePharma Global'
      }
    ];

    let allArticles = [];
    let currentFilter = 'all';

    // Set today's live date
    document.getElementById('current-date').innerText = new Date().toLocaleDateString('en-US', {
      weekday: 'short', month: 'short', day: 'numeric', year: 'numeric'
    });

    // Automatically Detect Smart Tags from Headline Text
    function detectTag(title, forcedTag) {
      if (forcedTag) return forcedTag;
      const t = title.toLowerCase();

      if (t.includes('warning letter') || t.includes('form 483') || t.includes('oai') || t.includes('import alert')) {
        return 'warning';
      }
      if (t.includes('recall') || t.includes('alert') || t.includes('substandard') || t.includes('banned') || t.includes('violation')) {
        return 'recall';
      }
      if (t.includes('launch') || t.includes('approve') || t.includes('approval') || t.includes('cleared') || t.includes('nod')) {
        return 'launch';
      }
      if (t.includes('acquire') || t.includes('acquisition') || t.includes('merger') || t.includes('buyout') || t.includes('deal')) {
        return 'ma';
      }
      return 'news';
    }

    function getTagLabel(tag) {
      switch(tag) {
        case 'warning': return '<i class="fas fa-file-signature"></i> WARNING LETTER';
        case 'recall': return '<i class="fas fa-triangle-exclamation"></i> ALERT / RECALL';
        case 'launch': return '<i class="fas fa-bolt"></i> LAUNCH / APPROVAL';
        case 'ma': return '<i class="fas fa-handshake"></i> M&A / DEAL';
        default: return '<i class="fas fa-newspaper"></i> INDUSTRY NEWS';
      }
    }

    // Fetch and aggregate feeds using RSS2JSON Engine
    async function loadFeeds() {
      const feedContainer = document.getElementById('feed-container');
      allArticles = [];

      try {
        const promises = RSS_FEEDS.map(feed => 
          fetch(`https://api.rss2json.com/1.0/api.json?rss_url=${encodeURIComponent(feed.url)}`)
            .then(res => res.json())
            .then(data => {
              if (data.status === 'ok') {
                return data.items.map(item => ({
                  title: item.title,
                  link: item.link,
                  pubDate: new Date(item.pubDate),
                  snippet: item.description.replace(/<[^>]*>?/gm, '').slice(0, 140) + '...',
                  source: feed.sourceName,
                  tag: detectTag(item.title, feed.forcedTag)
                }));
              }
              return [];
            })
            .catch(() => [])
        );

        const results = await Promise.all(promises);
        allArticles = results.flat().sort((a, b) => b.pubDate - a.pubDate);

        renderArticles(allArticles);
      } catch (err) {
        feedContainer.innerHTML = `<div class="loading-state"><p style="color:#ef4444;">Failed to fetch live feeds. Please try refreshing.</p></div>`;
      }
    }

    function renderArticles(articles) {
      const container = document.getElementById('feed-container');
      
      if (articles.length === 0) {
        container.innerHTML = `<div class="loading-state"><p>No news items match your search or filter.</p></div>`;
        return;
      }

      container.innerHTML = articles.map(art => `
        <article class="card">
          <div>
            <div class="card-header">
              <span class="tag ${art.tag}">${getTagLabel(art.tag)}</span>
              <span class="source-name">${art.source}</span>
            </div>
            <a href="${art.link}" target="_blank" class="card-title">${art.title}</a>
            <p class="card-snippet">${art.snippet}</p>
          </div>
          <div class="card-footer">
            <span>${art.pubDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}</span>
            <a href="${art.link}" target="_blank" class="read-link">Read Full Report <i class="fas fa-arrow-right"></i></a>
          </div>
        </article>
      `).join('');
    }

    // Filter by Pill Selection
    function filterArticles(category, element) {
      document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
      element.classList.add('active');
      currentFilter = category;
      applyFilters();
    }

    // Live Keyword Search
    document.getElementById('search-input').addEventListener('input', applyFilters);

    function applyFilters() {
      const searchTerm = document.getElementById('search-input').value.toLowerCase();
      
      const filtered = allArticles.filter(art => {
        const matchesCategory = currentFilter === 'all' || art.tag === currentFilter;
        const matchesSearch = art.title.toLowerCase().includes(searchTerm) || art.snippet.toLowerCase().includes(searchTerm);
        return matchesCategory && matchesSearch;
      });

      renderArticles(filtered);
    }

    // Initial load
    loadFeeds();
  </script>
</body>
</html>
