<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PharmaVibe — AI Regulatory Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-color: #0f172a; 
      --card-bg: #1e293b; 
      --card-border: #334155;
      --text-main: #f8fafc; 
      --text-muted: #94a3b8; 
      --accent-blue: #38bdf8;
      --accent-vibe: #a855f7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--text-main); padding-bottom: 50px; }
    
    header { background-color: #0f172a; border-bottom: 1px solid var(--card-border); padding: 20px 24px; position: sticky; top: 0; z-index: 100; }
    .header-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
    
    .logo { display: flex; align-items: center; gap: 12px; }
    .logo i { font-size: 26px; color: var(--accent-vibe); }
    .logo h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
    .logo h1 span { color: var(--accent-vibe); }
    
    .live-badge { background: rgba(168, 85, 247, 0.15); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.3); padding: 5px 12px; border-radius: 20px; font-weight: 600; font-size: 12px; display: flex; align-items: center; gap: 6px; }
    .pulse-dot { width: 8px; height: 8px; background-color: #a855f7; border-radius: 50%; box-shadow: 0 0 8px #a855f7; }
    
    main { max-width: 1200px; margin: 30px auto 0; padding: 0 20px; }
    .news-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; }
    
    .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; transition: transform 0.2s ease, border-color 0.2s ease; }
    .card:hover { transform: translateY(-3px); border-color: var(--accent-vibe); }
    
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .tag { font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 6px; background: rgba(168, 85, 247, 0.15); color: #c084fc; text-transform: uppercase; }
    .source { font-size: 12px; color: var(--text-muted); font-weight: 500; }
    
    .card-title { font-size: 16px; font-weight: 600; color: #fff; margin-bottom: 12px; text-decoration: none; line-height: 1.4; display: block; }
    .card-title:hover { color: var(--accent-blue); }
    
    .ai-box { background: rgba(255,255,255,0.03); border-left: 3px solid var(--accent-vibe); padding: 12px; margin-bottom: 16px; border-radius: 0 8px 8px 0; font-size: 13px; color: #cbd5e1; line-height: 1.5; }
    .ai-box strong { color: #e9d5ff; }
    
    .read-link { color: var(--accent-blue); text-decoration: none; font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
    .read-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header>
    <div class="header-container">
      <div class="logo">
        <i class="fas fa-wave-square"></i>
        <h1>Pharma<span>Vibe</span></h1>
      </div>
      <div class="live-badge">
        <span class="pulse-dot"></span> AI Feed Active
      </div>
    </div>
  </header>

  <main>
    <div class="news-grid" id="feed-container">
      <p style="color: var(--text-muted);">Loading PharmaVibe AI insights...</p>
    </div>
  </main>

  <script>
    async function loadData() {
      const container = document.getElementById('feed-container');
      try {
        const res = await fetch('data.json');
        const articles = await res.json();
        
        container.innerHTML = articles.map(art => `
          <article class="card">
            <div>
              <div class="card-header">
                <span class="tag">${art.category || 'NEWS'}</span>
                <span class="source">${art.source || ''}</span>
              </div>
              <a href="${art.link}" target="_blank" class="card-title">${art.title}</a>
              <div class="ai-box">
                <strong>✨ Vibe Takeaway:</strong> ${art.ai_summary || art.raw_desc || 'No summary available.'}
              </div>
            </div>
            <a href="${art.link}" target="_blank" class="read-link">Read Full Article <i class="fas fa-arrow-right"></i></a>
          </article>
        `).join('');
      } catch (err) {
        container.innerHTML = `<p style="color: #ef4444;">Could not load feed data. Ensure data.json exists in your repository.</p>`;
      }
    }
    loadData();
  </script>
</body>
</html>
